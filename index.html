<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Aninha</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" aria-label="Uma carta para Aninha">
      <div class="hero-photo" aria-hidden="true"></div>
      <div class="player" aria-label="Reprodutor de música">
        <button class="play" id="play" aria-label="Reproduzir música"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
        <span class="track-title">Clique aqui antes de ler</span>
        <input id="seek" class="seek" type="range" min="0" max="100" value="0" aria-label="Progresso da música">
        <span id="time" class="time">0:00 / 3:28</span>
        <button class="sound" id="mute" aria-label="Silenciar música"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button>
      </div>
      <audio id="audio" preload="metadata" src="assets/me-encontra.mp3"></audio>
    </section>
      <div class="message">
        <h1>Você carrega o sol no olhar</h1>
        <p>Quando sorri, é difícil não querer sorrir também. Mas, acima de tudo, o que mais me encanta é perceber o brilho da graça de Deus em sua vida.</p>
      </div>
    <section class="section-three" aria-label="Carta animada">
      <div class="section-three-sticky">
        <div class="section-three-video" aria-label="Carta para Aninha entre flores">
          <video id="letter-video" muted playsinline preload="auto" webkit-playsinline aria-hidden="true">
            <source src="assets/76851.mp4" type="video/mp4">
          </video>
        </div>
      </div>
    </section>
    <section class="section-four" aria-label="Formulário para Aninha"><div class="section-four-paper"><div class="section-four-form"><iframe
  src="https://docs.google.com/forms/d/e/1FAIpQLSdmi_on2J_rTP8Zy85sx1q4nQhYCOtfwQjwDQbREpiflvG7sw/viewform?embedded=true"
  width="640"
  height="998"
  frameborder="0"
  marginheight="0"
  marginwidth="0">
  Carregando…
</iframe></div></div></section>
  </main>
</body>
</html>
